name: Linux GUI build dependencies
description: >-
  Installs the GTK 4 and WebKitGTK 6.0 development packages that the Wails v3
  cgo sources link (needed by any Linux job that compiles
  cmd/fileengine-desktop, including go vet/test ./...). Downloaded .deb files
  are cached per runner image, architecture and package list.
runs:
  using: composite
  steps:
    - name: Resolve the apt package cache key
      id: plan
      shell: bash
      run: |
        set -euo pipefail
        packages="libgtk-4-dev libwebkitgtk-6.0-dev"
        list_hash="$(printf '%s' "$packages" | sha256sum | cut -c1-16)"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"
        echo "prefix=apt-${ImageOS:-unknown}-${RUNNER_ARCH}-${list_hash}-" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Restore downloaded packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.plan.outputs.prefix }}${{ steps.plan.outputs.image }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
    - name: Install packages
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGES: ${{ steps.plan.outputs.packages }}
      run: |
        set -euo pipefail
        archives="$RUNNER_TEMP/apt-archives"
        mkdir -p "$archives/partial"
        # The man-db trigger dominates install time on hosted images.
        sudo rm -f /var/lib/man-db/auto-update
        read -r -a packages <<< "$PACKAGES"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$archives" "${packages[@]}"
        sudo apt-get autoclean -o Dir::Cache::Archives="$archives"
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        echo "gtk4 $(pkg-config --modversion gtk4), webkitgtk-6.0 $(pkg-config --modversion webkitgtk-6.0)"
