name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version stamped into binaries (without the leading v); empty uses git describe
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: go1.27.2
  GOFLAGS: -mod=readonly
  NODE_VERSION: "24"
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: 代码检查与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go vet/test ./... compile the desktop, whose Wails sources link GTK/WebKitGTK.
      - uses: ./.github/actions/linux-gui-deps
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/wails-cli
      - name: 格式、依赖、静态检查、测试、前端检查与构建
        run: wails3 task check

  server:
    name: 服务端 · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, label: Linux x64 }
          - { goos: linux, goarch: arm64, label: Linux ARM64 }
          - { goos: darwin, goarch: amd64, label: macOS Intel }
          - { goos: darwin, goarch: arm64, label: macOS Apple 芯片 }
          - { goos: windows, goarch: amd64, label: Windows x64 }
          - { goos: windows, goarch: arm64, label: Windows ARM64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: server-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The CLI must be built for the runner, not the GOOS/GOARCH target.
      - uses: ./.github/actions/wails-cli
        env:
          GOOS: ""
          GOARCH: ""
      - name: 构建并打包服务端
        run: wails3 task package:server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: 桌面版 · ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS link the native webview through cgo: build on a
          # matching host (macOS switches architecture with GOARCH alone).
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, label: Linux x64 (.deb) }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, label: Linux ARM64 (.deb) }
          - { goos: darwin, goarch: arm64, runner: macos-15, label: macOS Apple 芯片 (.dmg) }
          - { goos: darwin, goarch: amd64, runner: macos-15, label: macOS Intel (.dmg) }
          # Windows needs no cgo (pure-Go SQLite, WebView2 via syscalls).
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04, label: Windows x64 (安装包) }
          - { goos: windows, goarch: arm64, runner: ubuntu-24.04, label: Windows ARM64 (安装包) }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: matrix.goos == 'linux'
        uses: ./.github/actions/linux-gui-deps
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/wails-cli
        env:
          GOOS: ""
          GOARCH: ""
      - if: matrix.goos == 'windows'
        name: 安装 NSIS（Windows 安装包）
        run: sudo apt-get install -y --no-install-recommends nsis
      - name: 构建并打包桌面版
        run: wails3 task package:desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Single required status check for branch protection.
  ci-ok:
    name: 全部通过
    if: always()
    needs: [check, server, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总：任何一项失败都算失败
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::CI jobs not successful: $failed"
            exit 1
          fi
