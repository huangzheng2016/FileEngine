name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not a v<semver> release tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish the GitHub release
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la release
          (cd release && sha256sum * > SHA256SUMS)
          cat > notes.md <<'EOF'
          ### Server (single binary, embedded Web UI, CGO-free)
          `fileengine_<os>_<arch>` — linux/darwin/windows × amd64/arm64

          ### Desktop (Wails v3, server in-process)
          `fileengine-desktop_<os>_<arch>` — linux/darwin/windows × amd64/arm64.
          Linux needs GTK 4 + WebKitGTK 6.0 at runtime; Windows needs the WebView2 runtime.
          EOF
          gh release create "$TAG" --title "FileEngine $TAG" --notes-file notes.md release/*
