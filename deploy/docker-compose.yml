name: fileengine

services:
  fileengine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fileengine:test
    container_name: fileengine
    ports:
      # Published on the host loopback only. To expose on the LAN, set
      # FE_BIND=0.0.0.0 in deploy/.env (the API still requires the token).
      - "${FE_BIND:-127.0.0.1}:${FE_PORT:-8080}:8080"
    volumes:
      # Persistent state: config.yaml + SQLite DB survive restarts/recreates.
      - ./data:/data
    environment:
      # Non-secret runtime config, interpolated from deploy/.env on the host.
      # Secrets (model API key) are NOT passed to the container — bootstrap.sh
      # pushes them straight into the API from the host.
      FE_AGENT_CONCURRENCY: "${FE_AGENT_CONCURRENCY:-1}"
      FE_AGENT_BATCH_SIZE: "${FE_AGENT_BATCH_SIZE:-50}"
      FE_AGENT_MAX_STEP: "${FE_AGENT_MAX_STEP:-150}"
      FE_AGENT_MAX_RETRIES: "${FE_AGENT_MAX_RETRIES:-3}"
      FE_AGENT_MAX_FILE_READ_SIZE: "${FE_AGENT_MAX_FILE_READ_SIZE:-102400}"
      # NFS scan connection pool (see deploy/.env.example)
      FE_NFS_SCAN_CONNS: "${FE_NFS_SCAN_CONNS:-8}"
      # Host dirs LOCAL filesystems may use (mount them into the container).
      FE_LOCAL_ROOTS: "${FE_LOCAL_ROOTS:-}"
    restart: unless-stopped
